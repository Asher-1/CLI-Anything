name: test-acloudviewer-harness

# Cross-platform test matrix for the ACloudViewer CLI/MCP harness.
# The suite is platform-independent (installer, source-build plans, MCP
# client registration, CLI wiring); this workflow makes that claim real on
# every OS instead of only the maintainer's Linux machine.

on:
  push:
    paths:
      - "acloudviewer/agent-harness/**"
      - ".github/workflows/test-acloudviewer-harness.yml"
  pull_request:
    paths:
      - "acloudviewer/agent-harness/**"
      - ".github/workflows/test-acloudviewer-harness.yml"
  workflow_dispatch:

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # macOS label history on 2026-11-13/14, both annotation-verified:
      #  * macos-13 is retired by GitHub — jobs target it forever queue and
      #    are later recycled with the check annotation
      #    "repository invocation blocked" (two runs lost ~6-7h this way).
      #  * macos-latest (arm64) intermittently hits real capacity limits
      #    (annotation: "Due to capacity constraints, jobs targeting macOS
      #    arm64 runners ..."); the pool does serve when load drops — the
      #    same matrix went success on arm64 earlier the same day. The suite
      #    is pure Python (architecture-independent), so arm64 is fine and
      #    a queued-out run converges on rerun.
      matrix:
        # All three versions are declared supported (setup.py
        # python_requires=">=3.10" plus the 3.10/3.11/3.12 classifiers), so
        # each must be exercised; the harness uses no version-gated syntax
        # (no except*/tomllib/TaskGroup), what changes between interpreters
        # is the dependency-resolution combination pip picks.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install harness (editable, with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e "acloudviewer/agent-harness[dev]"

      - name: Run harness test suite
        run: pytest acloudviewer/agent-harness/cli_anything/acloudviewer/tests/ -q --tb=short
