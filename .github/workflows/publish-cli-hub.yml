name: Publish cli-hub-py to PyPI

on:
  push:
    branches: [main]
    paths:
      - "cli-hub/**"
      - "!cli-hub/tests/**"
      - "!cli-hub/README.md"

jobs:
  publish:
    # Publishing uses PyPI Trusted Publishing (OIDC) — no tokens needed.
    #
    # One-time setup (required before this job can succeed):
    #   1. Register the `cli-hub-py` name on PyPI (https://pypi.org/account/register/)
    #   2. On the project page: Manage → Publishing → "Add a new pending publisher"
    #      - GitHub repository owner: Asher-1
    #      - GitHub repository name: CLI-Anything
    #      - Workflow name: publish-cli-hub.yml
    #   3. Approve the pending publisher.
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # required for trusted publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check if version already published
        id: check
        run: |
          VERSION=$(python -c "import re; print(re.search(r'version=\"([^\"]+)\"', open('cli-hub/setup.py').read()).group(1))")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/cli-hub-py/$VERSION/json")
          if [ "$STATUS" = "200" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION already on PyPI — skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION not on PyPI — will publish."
          fi

      - name: Build package
        if: steps.check.outputs.skip == 'false'
        run: |
          pip install build
          cd cli-hub
          python -m build

      - name: Publish to PyPI
        if: steps.check.outputs.skip == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: cli-hub/dist/
